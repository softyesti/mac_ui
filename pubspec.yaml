name: mac_ui
description: "UI kit based on the current macOS design language."

homepage: https://softyes.com.br
repository: https://github.com/softyesti/mac_ui

platforms:
  linux:
  macos:
  windows:

version: 0.1.0

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1
  dbus: ^0.8.0
  get_it: ^9.3.0
  system_theme: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/literata/OFL.txt
    - assets/fonts/jetbrains/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - style: normal
          asset: assets/fonts/inter/Inter-VariableFont_opsz,wght.ttf
        - style: italic
          asset: assets/fonts/inter/Inter-Italic-VariableFont_opsz,wght.ttf

    - family: JetBrains
      fonts:
        - style: normal
          asset: assets/fonts/jetbrains/JetBrainsMono-VariableFont_wght.ttf
        - style: italic
          asset: assets/fonts/jetbrains/JetBrainsMono-Italic-VariableFont_wght.ttf

    - family: Literata
      fonts:
        - style: normal
          asset: assets/fonts/literata/Literata-VariableFont_opsz,wght.ttf
        - style: italic
          asset: assets/fonts/literata/Literata-Italic-VariableFont_opsz,wght.ttf

    - family: Nunito
      fonts:
        - style: normal
          asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
        - style: italic
          asset: assets/fonts/nunito/Nunito-Italic-VariableFont_wght.ttf
