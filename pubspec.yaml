name: mac_ui
description: "UI kit based on the current macOS design language."

homepage: https://softyes.com.br
repository: https://github.com/softyesti/mac_ui

platforms:
  linux:
  macos:
  windows:

version: 0.1.0

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/

fonts:
  - family: Inter
    fonts:
      - weight: 100
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-Thin.ttf
      - weight: 200
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-ExtraLight.ttf
      - weight: 300
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-Light.ttf
      - weight: 400
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-Regular.ttf
      - weight: 500
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-Medium.ttf
      - weight: 600
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-SemiBold.ttf
      - weight: 700
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-Bold.ttf
      - weight: 800
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-ExtraBold.ttf
      - weight: 900
        style: normal
        asset: assets/fonts/inter/static/Inter_28pt-Black.ttf
      - weight: 100
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-ThinItalic.ttf
      - weight: 200
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-ExtraLightItalic.ttf
      - weight: 300
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-LightItalic.ttf
      - weight: 400
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-Italic.ttf
      - weight: 500
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-MediumItalic.ttf
      - weight: 600
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-SemiBoldItalic.ttf
      - weight: 700
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-BoldItalic.ttf
      - weight: 800
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-ExtraBoldItalic.ttf
      - weight: 900
        style: italic
        asset: assets/fonts/inter/static/Inter_28pt-BlackItalic.ttf
